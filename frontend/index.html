<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Persistent NixOS development workspaces in the browser" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>WebNix</title>
  </head>
  <body>
    <main id="app">
      <div id="status" role="status" aria-live="polite">Connecting…</div>
      <div id="terminal" aria-label="NixOS terminal"></div>
      <nav id="toolbar" aria-label="Terminal keys">
        <button data-special="escape">Esc</button>
        <button data-special="tab">Tab</button>
        <button data-mod="ctrl">Ctrl</button>
        <button data-key="~">~</button>
        <button data-key="/">/</button>
        <button data-key="|">|</button>
        <button data-key="-">-</button>
        <button data-key="_">_</button>
      </nav>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
